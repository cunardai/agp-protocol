[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agp-mcp"
version = "0.5.0"
description = "MCP server binding for the Agent Governance Protocol"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-mock>=3.14"]

[project.scripts]
agp-mcp = "agp_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["agp_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
