components:
  schemas:
    OperationStatus:
      type: string
      enum:
        - pending
        - running
        - awaiting_human
        - succeeded
        - failed
        - cancelled

    AsyncOperation:
      type: object
      required:
        - operation_id
        - status
        - created_at
        - status_url
      properties:
        operation_id:
          type: string
        status:
          $ref: '#/components/schemas/OperationStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status_url:
          type: string
          format: uri
        result_url:
          type: string
          format: uri
        callback_url:
          type: string
          format: uri
        error:
          $ref: '#/components/schemas/ErrorDetail'
      additionalProperties: false

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: object
      additionalProperties: false

    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      additionalProperties: false