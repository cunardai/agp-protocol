[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agp-sdk"
version = "1.0.0"
description = "Python SDK for the Agent Governance Protocol"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["ai", "agents", "governance", "accountability", "compliance", "agp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",        # httpx mock library
    "pytest-httpx>=0.30",
]

[project.urls]
Homepage     = "https://agp-protocol.dev"
Repository   = "https://github.com/cunardai/agp"
"Bug Tracker" = "https://github.com/cunardai/agp/issues"

[tool.hatch.build.targets.wheel]
packages = ["agp"]
artifacts = ["README.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths   = ["tests"]
